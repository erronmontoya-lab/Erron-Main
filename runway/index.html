<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Tracker</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #b42727;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --good-text: #0ca30c;
    --critical-text: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --accent: #3987e5;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --good-text: #0ca30c;
  --critical-text: #e66767;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

button, .btn {
  font: inherit; font-size: 13.5px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; line-height: 1.2;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.07); background: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding: 5px 8px; }
button.ghost:hover { background: var(--surface-2); color: var(--ink); }
button.small { font-size: 12.5px; padding: 4px 9px; }
button.danger { color: var(--critical-text); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; box-shadow: var(--shadow); min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

.hero { display: grid; grid-template-columns: 1.3fr 2fr; gap: 14px; margin-bottom: 14px; }
.hero-main .label { font-size: 13px; color: var(--ink-2); }
.hero-main .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 4px; }
.hero-main .big small { font-size: 18px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); margin-top: 8px; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile .label { font-size: 12.5px; color: var(--ink-2); }
.tile .val { font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -0.01em; }
.tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }

.alerts { display: grid; gap: 8px; margin-bottom: 14px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; }
.alert .ico { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }
.alert.critical .ico { background: var(--critical); }
.alert.warning .ico { background: var(--warning); color: #0b0b0b; }
.alert.good .ico { background: var(--good); }
.alert b { font-weight: 650; }

.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin: 14px 0; }

/* chart */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 12.5px; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.legend i.dotkey { width: 8px; height: 8px; border-radius: 50%; }
.chart-box { position: relative; width: 100%; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 2;
}
.tip .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
details.tableview { margin-top: 10px; font-size: 13px; }
details.tableview summary { cursor: pointer; color: var(--ink-2); }

/* lists & tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ess { color: var(--ink); font-weight: 600; }
.pill.over { background: transparent; border: 1px solid var(--critical); color: var(--critical-text); font-weight: 600; }
.in { color: var(--good-text); }
.rowbtns { display: flex; gap: 2px; justify-content: flex-end; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13.5px; padding: 14px 4px; text-align: center; }

.upcoming .ev { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.upcoming .ev:last-child { border-bottom: 0; }
.upcoming .date { font-size: 12px; color: var(--ink-2); line-height: 1.15; }
.upcoming .date b { display: block; font-size: 16px; color: var(--ink); }
.upcoming .name { font-size: 13.5px; }
.upcoming .bal { font-size: 12px; color: var(--muted); }
.upcoming .amt { text-align: right; font-weight: 600; font-size: 13.5px; }
.upcoming .amt .rowbtns { margin-top: 3px; }
.scroll { max-height: 440px; overflow-y: auto; }

.planner label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.planner .answer { font-size: 26px; font-weight: 700; margin: 12px 0 4px; letter-spacing: -0.01em; }
.planner p { margin: 6px 0; font-size: 13.5px; color: var(--ink-2); }

.bars .bar { display: grid; grid-template-columns: 120px 1fr 80px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.bars .track { height: 12px; }
.bars .fill { height: 12px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.bars .fill.ess { background: var(--s1); }
.bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--grid); }
.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--ink-2); padding: 8px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:hover { background: transparent; color: var(--ink); }

/* forms / dialog */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 18px; }
dialog h3 { margin: 0 0 14px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; font-weight: 550; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
input[type=text], input[type=number], input[type=date], select {
  width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--page); color: var(--ink);
}
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
.settings-row .field { margin: 0; min-width: 180px; }
footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }

.welcome { text-align: center; padding: 36px 16px; }
.welcome h2 { font-size: 20px; margin-bottom: 8px; }
.welcome p { color: var(--ink-2); max-width: 520px; margin: 0 auto 18px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
  background: var(--ink); color: var(--page); padding: 10px 12px 10px 16px; border-radius: 10px;
  font-size: 13.5px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
.toast[hidden] { display: none; }
.toast button { background: transparent; color: var(--page); border-color: currentColor; font-weight: 600; }
.toast button:hover { background: rgba(127,127,127,.25); }
.form-error { margin-top: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--critical); color: var(--critical-text); font-size: 13px; }
.form-error[hidden], .alerts[hidden] { display: none; }
#banners { margin-bottom: 14px; }
.alert .small { flex: none; }
.alert div .small { margin-left: 6px; }

@media (max-width: 860px) {
  .hero, .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .hero-main .big { font-size: 38px; }
  .bars .bar { grid-template-columns: 90px 1fr 70px; }
  .hide-sm { display: none; }
  .row2 { grid-template-columns: 1fr; }
}
@media print {
  .actions, .rowbtns, button { display: none !important; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Runway Tracker</h1>
      <div class="sub">Bills, money coming in, and how long your cash lasts.</div>
    </div>
    <div class="actions">
      <button class="primary" data-action="checkin">Log balance check-in</button>
      <button data-action="export">Export backup</button>
      <button data-action="import">Import</button>
      <button data-action="theme" aria-label="Toggle light or dark theme">Theme</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <div id="banners" class="alerts" hidden></div>
  <main id="app"><noscript><div class="card">Runway Tracker needs JavaScript turned on.</div></noscript></main>

  <footer>Your data stays in this browser and is never uploaded. A snapshot is saved automatically each day; use <b>Export backup</b> to keep a copy that survives clearing your browser.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
