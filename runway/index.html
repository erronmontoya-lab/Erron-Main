<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Tracker</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #b42727;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9a988f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --good-text: #0ca30c;
    --critical-text: #e66767;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #9a988f;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --accent: #3987e5;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --good-text: #0ca30c;
  --critical-text: #e66767;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 13px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

button, .btn {
  font: inherit; font-size: 13.5px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; line-height: 1.2;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.07); background: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding: 5px 8px; }
button.ghost:hover { background: var(--surface-2); color: var(--ink); }
button.small { font-size: 12.5px; padding: 4px 9px; }
button.danger { color: var(--critical-text); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; box-shadow: var(--shadow); min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

.hero { display: grid; grid-template-columns: 1.3fr 2fr; gap: 14px; margin-bottom: 14px; }
.hero-main .label { font-size: 13px; color: var(--ink-2); }
.hero-main .big { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 4px; }
.hero-main .big small { font-size: 18px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-2); margin-top: 8px; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile .label { font-size: 12.5px; color: var(--ink-2); }
.tile .val { font-size: 22px; font-weight: 650; margin-top: 4px; letter-spacing: -0.01em; }
.tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }

.alerts { display: grid; gap: 8px; margin-bottom: 14px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; }
.alert .ico { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }
.alert.critical .ico { background: var(--critical); }
.alert.warning .ico { background: var(--warning); color: #0b0b0b; }
.alert.good .ico { background: var(--good); }
.alert b { font-weight: 650; }

.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin: 14px 0; }

/* chart */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 12.5px; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.legend i.dotkey { width: 8px; height: 8px; border-radius: 50%; }
.chart-box { position: relative; width: 100%; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 2;
}
.tip .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
details.tableview { margin-top: 10px; font-size: 13px; }
details.tableview summary { cursor: pointer; color: var(--ink-2); }

/* lists & tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ess { color: var(--ink); font-weight: 600; }
.pill.over { background: transparent; border: 1px solid var(--critical); color: var(--critical-text); font-weight: 600; }
.in { color: var(--good-text); }
.rowbtns { display: flex; gap: 2px; justify-content: flex-end; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13.5px; padding: 14px 4px; text-align: center; }

.upcoming .ev { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.upcoming .ev:last-child { border-bottom: 0; }
.upcoming .date { font-size: 12px; color: var(--ink-2); line-height: 1.15; }
.upcoming .date b { display: block; font-size: 16px; color: var(--ink); }
.upcoming .name { font-size: 13.5px; }
.upcoming .bal { font-size: 12px; color: var(--muted); }
.upcoming .amt { text-align: right; font-weight: 600; font-size: 13.5px; }
.upcoming .amt .rowbtns { margin-top: 3px; }
.scroll { max-height: 440px; overflow-y: auto; }

.planner label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.planner .answer { font-size: 26px; font-weight: 700; margin: 12px 0 4px; letter-spacing: -0.01em; }
.planner p { margin: 6px 0; font-size: 13.5px; color: var(--ink-2); }

.bars .bar { display: grid; grid-template-columns: 120px 1fr 80px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.bars .track { height: 12px; }
.bars .fill { height: 12px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.bars .fill.ess { background: var(--s1); }
.bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; border-bottom: 1px solid var(--grid); }
.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--ink-2); padding: 8px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:hover { background: transparent; color: var(--ink); }

/* forms / dialog */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { padding: 18px; }
dialog h3 { margin: 0 0 14px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; font-weight: 550; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
input[type=text], input[type=number], input[type=date], select {
  width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--page); color: var(--ink);
}
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.check input { width: 16px; height: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.settings-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
.settings-row .field { margin: 0; min-width: 180px; }
footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }

.welcome { text-align: center; padding: 36px 16px; }
.welcome h2 { font-size: 20px; margin-bottom: 8px; }
.welcome p { color: var(--ink-2); max-width: 520px; margin: 0 auto 18px; }

@media (max-width: 860px) {
  .hero, .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .hero-main .big { font-size: 38px; }
  .bars .bar { grid-template-columns: 90px 1fr 70px; }
  .hide-sm { display: none; }
  .row2 { grid-template-columns: 1fr; }
}
@media print {
  .actions, .rowbtns, button { display: none !important; }
  body { background: #fff; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Runway Tracker</h1>
      <div class="sub">Bills, money coming in, and how long your cash lasts.</div>
    </div>
    <div class="actions">
      <button class="primary" data-action="checkin">Log balance check-in</button>
      <button data-action="export">Export backup</button>
      <button data-action="import">Import</button>
      <button data-action="theme" aria-label="Toggle light or dark theme">Theme</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="app"></main>

  <footer>Your data stays in this browser (localStorage). Use <b>Export backup</b> regularly to save a copy.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
(() => {
'use strict';

/* ---------- storage ---------- */
const KEY = 'runway-tracker.v1';
const blank = () => ({
  version: 1,
  accounts: [],
  bills: [],
  income: [],
  checkins: [],
  activity: [],
  settings: { cushion: 0, targetMonths: 12, horizon: 24 }
});
let S = load();
let ui = { tab: 'bills', range: 12 };
try { const u = JSON.parse(localStorage.getItem(KEY + '.ui') || 'null'); if (u) ui = { ...ui, ...u }; } catch (e) {}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); return { ...blank(), ...d, settings: { ...blank().settings, ...(d.settings || {}) } }; }
  } catch (e) {}
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  try { localStorage.setItem(KEY + '.ui', JSON.stringify(ui)); } catch (e) {}
}
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- dates ---------- */
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function addMonths(d, n) {
  const day = d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, last));
  return t;
}
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const fmtDate = (d, opts = { month: 'short', day: 'numeric', year: 'numeric' }) => d.toLocaleDateString(undefined, opts);

const FREQ = {
  weekly:    { label: 'Weekly',        perMonth: 52 / 12 },
  biweekly:  { label: 'Every 2 weeks', perMonth: 26 / 12 },
  monthly:   { label: 'Monthly',       perMonth: 1 },
  quarterly: { label: 'Quarterly',     perMonth: 1 / 3 },
  annual:    { label: 'Yearly',        perMonth: 1 / 12 },
  once:      { label: 'One time',      perMonth: 0 }
};
function nthOccurrence(base, freq, k) {
  switch (freq) {
    case 'weekly': return addDays(base, 7 * k);
    case 'biweekly': return addDays(base, 14 * k);
    case 'monthly': return addMonths(base, k);
    case 'quarterly': return addMonths(base, 3 * k);
    case 'annual': return addMonths(base, 12 * k);
    default: return k === 0 ? base : null;
  }
}
function occurrences(item, to) {
  const out = [];
  if (!item.next) return out;
  const base = parse(item.next);
  const end = item.end ? parse(item.end) : null;
  for (let k = 0; k < 5000; k++) {
    const d = nthOccurrence(base, item.freq, k);
    if (!d || d > to) break;
    if (end && d > end) break;
    out.push(d);
  }
  return out;
}
const isActive = (item, on = today()) => !item.end || parse(item.end) >= on;

/* ---------- money ---------- */
const cur = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const cur2 = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, cents) => (cents ? cur2 : cur).format(n || 0);
function compact(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (a >= 1e3) return s + '$' + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
  return s + '$' + Math.round(a);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- model math ---------- */
const cashTotal = () => S.accounts.reduce((t, a) => t + (a.include === false ? 0 : +a.balance || 0), 0);
const monthly = (list, filter = () => true) => list.filter(filter).reduce((t, i) => t + (+i.amount || 0) * FREQ[i.freq].perMonth, 0);
const MONTH = 30.4375;

/**
 * Day-by-day projection from today.
 * Anything dated before today (overdue bill, unconfirmed income) lands on day 0.
 */
function simulate({ essentialOnly = false, extraMonthly = 0, days }) {
  const t0 = today();
  const end = addDays(t0, days);
  const delta = new Float64Array(days + 1);
  for (const b of S.bills) {
    if (essentialOnly && !b.essential) continue;
    for (const d of occurrences(b, end)) delta[Math.max(0, daysBetween(t0, d))] -= +b.amount || 0;
  }
  for (const i of S.income) {
    for (const d of occurrences(i, end)) delta[Math.max(0, daysBetween(t0, d))] += +i.amount || 0;
  }
  if (extraMonthly) for (let k = 1; k * MONTH <= days; k++) delta[Math.round(k * MONTH)] += extraMonthly;
  const bal = new Float64Array(days + 1);
  let b = cashTotal(), out = -1;
  const cushion = +S.settings.cushion || 0;
  for (let d = 0; d <= days; d++) {
    b += delta[d];
    bal[d] = b;
    if (out < 0 && b < cushion) out = d;
  }
  return { bal, out };
}
/** Smallest extra monthly amount (income or cuts) so cash stays above the cushion for `months`. */
function gapFor(months, essentialOnly) {
  const days = Math.round(months * MONTH);
  if (simulate({ essentialOnly, days }).out < 0) return 0;
  let lo = 0, hi = 1000;
  while (simulate({ essentialOnly, extraMonthly: hi, days }).out >= 0 && hi < 1e8) hi *= 2;
  for (let n = 0; n < 40; n++) {
    const mid = (lo + hi) / 2;
    if (simulate({ essentialOnly, extraMonthly: mid, days }).out >= 0) lo = mid; else hi = mid;
  }
  return hi;
}
function upcoming(daysAhead) {
  const t0 = today(), end = addDays(t0, daysAhead), ev = [];
  for (const b of S.bills) for (const d of occurrences(b, end)) ev.push({ kind: 'bill', item: b, date: d, amount: -(+b.amount || 0) });
  for (const i of S.income) for (const d of occurrences(i, end)) ev.push({ kind: 'income', item: i, date: d, amount: +i.amount || 0 });
  ev.sort((a, b) => a.date - b.date || a.amount - b.amount);
  let bal = cashTotal();
  for (const e of ev) { bal += e.amount; e.after = bal; e.overdue = e.date < t0; }
  return ev;
}

/* ---------- render ---------- */
const app = document.getElementById('app');

function render() {
  save();
  const hasData = S.accounts.length || S.bills.length || S.income.length;
  if (!hasData) { app.innerHTML = welcomeHTML(); return; }

  const H = Math.round((S.settings.horizon || 24) * MONTH);
  const all = simulate({ days: H });
  const ess = simulate({ essentialOnly: true, days: H });
  const cash = cashTotal();
  const billsMo = monthly(S.bills, b => b.freq !== 'once');
  const essMo = monthly(S.bills, b => b.freq !== 'once' && b.essential);
  const incMo = monthly(S.income, i => i.freq !== 'once' && isActive(i));
  const net = incMo - billsMo;

  app.innerHTML = `
    ${heroHTML(all, ess, cash, billsMo, essMo, incMo, net)}
    ${alertsHTML(all, ess)}
    <section class="card" aria-labelledby="chartTitle">
      <div class="card-head">
        <h2 id="chartTitle">Projected cash balance</h2>
        <div class="seg" role="group" aria-label="Chart range">
          ${[6, 12, 24].map(m => `<button data-action="range" data-m="${m}" aria-pressed="${ui.range === m}">${m} mo</button>`).join('')}
        </div>
      </div>
      <div class="legend">
        <span><i style="background:var(--s1)"></i>All bills</span>
        <span><i style="background:var(--s2)"></i>Essentials only</span>
        ${S.checkins.length ? `<span><i class="dotkey" style="background:var(--s3)"></i>Actual (check-ins)</span>` : ''}
        ${+S.settings.cushion ? `<span><i style="background:var(--muted);height:0;border-top:2px dashed var(--muted)"></i>Cushion ${money(S.settings.cushion)}</span>` : ''}
      </div>
      <div class="chart-box" id="chartBox"><div class="tip" id="tip"></div></div>
      ${monthTableHTML(all, ess)}
    </section>
    <div class="grid2">
      ${upcomingHTML()}
      ${plannerHTML()}
    </div>
    ${dataTabsHTML()}
    ${categoriesHTML()}
  `;
  drawChart(all, ess);
}

function runwayText(sim) {
  if (sim.out < 0) return { big: `${S.settings.horizon}+`, unit: 'months', date: null };
  const m = sim.out / MONTH;
  return { big: m < 1 ? Math.round(sim.out) : m.toFixed(1), unit: m < 1 ? (sim.out === 1 ? 'day' : 'days') : 'months', date: addDays(today(), sim.out) };
}
function statusOf(sim) {
  if (sim.out < 0 || sim.out > 12 * MONTH) return { cls: 'good', label: 'Comfortable', color: 'var(--good)' };
  if (sim.out > 6 * MONTH) return { cls: 'warning', label: 'Watch closely', color: 'var(--warning)' };
  if (sim.out > 3 * MONTH) return { cls: 'serious', label: 'Tight', color: 'var(--serious)' };
  return { cls: 'critical', label: 'Urgent', color: 'var(--critical)' };
}

function heroHTML(all, ess, cash, billsMo, essMo, incMo, net) {
  const r = runwayText(all), re = runwayText(ess), st = statusOf(all);
  const cushion = +S.settings.cushion;
  return `
  <section class="hero">
    <div class="card hero-main">
      <div class="label">Runway${cushion ? ` (until cash drops below ${money(cushion)})` : ''}</div>
      <div class="big">${r.big} <small>${r.unit}</small></div>
      <div class="sub">${r.date ? `Cash runs out around <b>${fmtDate(r.date)}</b>` : `Cash lasts beyond the ${S.settings.horizon}-month projection`}</div>
      <div class="status"><span class="dot" style="background:${st.color}"></span>${st.label}</div>
    </div>
    <div class="tiles">
      <div class="card tile"><div class="label">Cash on hand</div><div class="val">${money(cash)}</div><div class="note">${S.accounts.filter(a => a.include !== false).length} account(s)</div></div>
      <div class="card tile"><div class="label">Bills per month</div><div class="val">${money(billsMo)}</div><div class="note">${money(essMo)} essential</div></div>
      <div class="card tile"><div class="label">Income per month</div><div class="val">${money(incMo)}</div><div class="note">active sources</div></div>
      <div class="card tile"><div class="label">Net per month</div><div class="val" style="color:${net >= 0 ? 'var(--good-text)' : 'var(--critical-text)'}">${net >= 0 ? '+' : '−'}${money(Math.abs(net))}</div><div class="note">${net >= 0 ? 'cash growing' : 'burn rate'}</div></div>
      <div class="card tile"><div class="label">Essentials-only runway</div><div class="val">${re.big} ${re.unit}</div><div class="note">${re.date ? 'until ' + fmtDate(re.date, { month: 'short', year: 'numeric' }) : 'if you cut extras'}</div></div>
      <div class="card tile"><div class="label">Last check-in</div><div class="val">${S.checkins.length ? money(S.checkins[S.checkins.length - 1].total) : '—'}</div><div class="note">${S.checkins.length ? fmtDate(parse(S.checkins[S.checkins.length - 1].date)) : 'log one weekly'}</div></div>
    </div>
  </section>`;
}

function alertsHTML(all, ess) {
  const t0 = today(), A = [];
  const overdue = S.bills.filter(b => b.next && parse(b.next) < t0);
  if (overdue.length) A.push(['critical', '!', `<b>${overdue.length} overdue bill${overdue.length > 1 ? 's' : ''}:</b> ${overdue.map(b => esc(b.name)).join(', ')}. Mark them paid or skip them below.`]);
  if (all.out >= 0 && all.out <= 3 * MONTH) A.push(['critical', '!', `<b>Less than 3 months of runway.</b> Cutting to essentials gives you ${runwayText(ess).big} ${runwayText(ess).unit}.`]);
  for (const i of S.income) {
    if (!i.end) continue;
    const d = daysBetween(t0, parse(i.end));
    if (d >= 0 && d <= 60) A.push(['warning', '!', `<b>${esc(i.name)}</b> ends ${fmtDate(parse(i.end))} (${d} days). Your monthly income drops by ${money((+i.amount || 0) * FREQ[i.freq].perMonth)}.`]);
  }
  const lastCk = S.checkins[S.checkins.length - 1];
  if (S.accounts.length && (!lastCk || daysBetween(parse(lastCk.date), t0) > 10)) A.push(['warning', 'i', `<b>Update your balances.</b> ${lastCk ? `Last check-in was ${daysBetween(parse(lastCk.date), t0)} days ago.` : 'No check-ins yet.'} A weekly check-in keeps the runway honest.`]);
  if (!A.length) A.push(['good', '✓', 'No overdue bills and nothing ending soon.']);
  return `<div class="alerts" role="status">${A.map(([c, i, t]) => `<div class="alert ${c}"><span class="ico" aria-hidden="true">${i}</span><div>${t}</div></div>`).join('')}</div>`;
}

function upcomingHTML() {
  const ev = upcoming(30);
  return `<section class="card upcoming">
    <div class="card-head"><h2>Next 30 days</h2><span class="sub">${ev.length} item${ev.length === 1 ? '' : 's'}</span></div>
    <div class="scroll">
    ${ev.length ? ev.map(e => {
      const isNext = e.item.next && parse(e.item.next).getTime() === e.date.getTime();
      return `<div class="ev">
        <div class="date">${e.date.toLocaleDateString(undefined, { month: 'short' })}<b>${e.date.getDate()}</b></div>
        <div>
          <div class="name">${esc(e.item.name)} ${e.overdue ? '<span class="pill over">Overdue</span>' : ''} ${e.kind === 'bill' && e.item.essential ? '' : ''}</div>
          <div class="bal num">Balance after: ${money(e.after)}</div>
        </div>
        <div class="amt num ${e.amount > 0 ? 'in' : ''}">${e.amount > 0 ? '+' : '−'}${money(Math.abs(e.amount), true)}
          ${isNext ? `<div class="rowbtns">
            <button class="small" data-action="settle" data-kind="${e.kind}" data-id="${e.item.id}">${e.kind === 'bill' ? 'Paid' : 'Received'}</button>
            <button class="small ghost" data-action="skip" data-kind="${e.kind}" data-id="${e.item.id}" title="Move to next date without changing balances">Skip</button>
          </div>` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="empty">Nothing due in the next 30 days.</div>'}
    </div>
  </section>`;
}

function plannerHTML() {
  const tm = +S.settings.targetMonths || 12;
  const gapAll = gapFor(tm, false), gapEss = gapFor(tm, true);
  const ans = gapAll <= 0.5
    ? `<div class="answer" style="color:var(--good-text)">You're covered</div><p>Your cash lasts at least ${tm} months at your current bills and income.</p>`
    : `<div class="answer">${money(Math.ceil(gapAll))}<span class="sub" style="font-weight:500"> / month</span></div>
       <p>Extra income or spending cuts needed to keep cash above ${money(S.settings.cushion || 0)} for ${tm} months.</p>
       <p>${gapEss <= 0.5 ? `Or cut to <b>essentials only</b>: that alone gets you to ${tm} months.` : `Even on essentials only, you'd still need <b>${money(Math.ceil(gapEss))}/mo</b>.`}</p>`;
  return `<section class="card planner">
    <div class="card-head"><h2>Runway goal</h2></div>
    <label for="targetMonths">How many months do you want to be covered?</label>
    <input type="number" id="targetMonths" min="1" max="60" step="1" value="${tm}" data-setting="targetMonths">
    ${ans}
    <p class="muted" style="font-size:12px">Tip: plan for a job search of 6–9 months, plus about a month before the first paycheck arrives.</p>
  </section>`;
}

function dataTabsHTML() {
  const tabs = [['bills', `Bills & expenses (${S.bills.length})`], ['income', `Money coming in (${S.income.length})`], ['accounts', `Accounts (${S.accounts.length})`], ['history', 'History'], ['settings', 'Settings']];
  let body = '';
  if (ui.tab === 'bills') body = billsTable();
  else if (ui.tab === 'income') body = incomeTable();
  else if (ui.tab === 'accounts') body = accountsTable();
  else if (ui.tab === 'history') body = historyHTML();
  else body = settingsHTML();
  return `<section class="card" style="margin-bottom:14px">
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${ui.tab === k}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div>

  </section>`;
}

const freqCell = i => `${FREQ[i.freq].label}${i.freq !== 'once' && i.freq !== 'monthly' ? `<div class="muted" style="font-size:12px">${money((+i.amount || 0) * FREQ[i.freq].perMonth)}/mo</div>` : ''}`;
const nextCell = i => {
  if (!i.next) return '—';
  const d = parse(i.next), over = d < today();
  return `${fmtDate(d, { month: 'short', day: 'numeric' })}${over ? ' <span class="pill over">Overdue</span>' : ''}`;
};

function categoriesHTML() {
  const by = {};
  for (const b of S.bills) {
    if (b.freq === 'once') continue;
    const k = b.category || 'Other';
    by[k] = (by[k] || 0) + (+b.amount || 0) * FREQ[b.freq].perMonth;
  }
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '';
  const max = rows[0][1], total = rows.reduce((t, r) => t + r[1], 0);
  return `<section class="card bars">
    <div class="card-head"><h2>Where the money goes</h2><span class="sub">Monthly equivalent, ${money(total)} total</span></div>
    ${rows.map(([k, v]) => `<div class="bar" title="${esc(k)}: ${money(v)}/mo (${Math.round(v / total * 100)}%)">
      <div class="lbl">${esc(k)}</div>
      <div class="track"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div>
      <div class="r num" style="text-align:right">${money(v)}</div>
    </div>`).join('')}
  </section>`;
}

function monthTableHTML(all, ess) {

    rows.push(`<tr><td>${fmtDate(addDays(t0, d), { month: 'short', year: 'numeric' })}</td><td class="r num">${money(all.bal[d])}</td><td class="r num">${money(ess.bal[d])}</td></tr>`);

/* ---------- chart ---------- */
let chartState = null;
function niceStep(range, target) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function drawChart(all, ess) {
  const box = document.getElementById('chartBox');
  if (!box) return;
  const W = Math.max(300, box.clientWidth), Hh = W < 560 ? 240 : 300;
  const M = { l: 56, r: W < 560 ? 12 : 96, t: 12, b: 28 };
  const t0 = today();
  const days = Math.min(all.bal.length - 1, Math.round(ui.range * MONTH));
  const cks = S.checkins.map(c => ({ d: daysBetween(t0, parse(c.date)), v: c.total })).filter(c => c.d >= -183 && c.d <= 0);
  const dMin = cks.length ? Math.min(0, ...cks.map(c => c.d)) : 0;

  let vals = [+S.settings.cushion || 0, 0];
  for (let d = 0; d <= days; d++) vals.push(all.bal[d], ess.bal[d]);
  cks.forEach(c => vals.push(c.v));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) hi = lo + 1000;
  const step = niceStep(hi - lo, 5);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

  const x = d => M.l + (d - dMin) / (days - dMin) * (W - M.l - M.r);
  const y = v => M.t + (hi - v) / (hi - lo) * (Hh - M.t - M.b);
  const path = bal => { let p = ''; for (let d = 0; d <= days; d++) p += (d ? 'L' : 'M') + x(d).toFixed(1) + ' ' + y(bal[d]).toFixed(1); return p; };

  let g = '';
  for (let v = lo; v <= hi + 1e-6; v += step) {
    g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${M.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${compact(v)}</text>`;
  }
  // month ticks
  const totalMonths = Math.ceil((days - dMin) / MONTH);
  const every = W < 560 ? (totalMonths > 12 ? 6 : 3) : (totalMonths > 18 ? 3 : totalMonths > 9 ? 2 : 1);
  let mt = new Date(addDays(t0, dMin).getFullYear(), addDays(t0, dMin).getMonth() + 1, 1), idx = 0;
  while (daysBetween(t0, mt) <= days) {
    if (idx % every === 0) {
      const xd = x(daysBetween(t0, mt));
      const lab = mt.getMonth() === 0 || idx === 0 ? mt.toLocaleDateString(undefined, { month: 'short', year: '2-digit' }) : mt.toLocaleDateString(undefined, { month: 'short' });
      g += `<line x1="${xd}" x2="${xd}" y1="${Hh - M.b}" y2="${Hh - M.b + 4}" stroke="var(--axis)"/><text x="${xd}" y="${Hh - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>`;
    }
    mt = addMonths(mt, 1); idx++;
  }
  // zero baseline + cushion
  if (lo <= 0 && hi >= 0) g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const cushion = +S.settings.cushion || 0;
  if (cushion) g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y(cushion)}" y2="${y(cushion)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  // today marker
  if (dMin < 0) g += `<line x1="${x(0)}" x2="${x(0)}" y1="${M.t}" y2="${Hh - M.b}" stroke="var(--axis)" stroke-dasharray="2 3"/><text x="${x(0) + 4}" y="${M.t + 10}" font-size="11" fill="var(--muted)">Today</text>`;

  // series
  g += `<path d="${path(ess.bal)}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<path d="${path(all.bal)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  if (cks.length) {
    const pts = [...cks].sort((a, b) => a.d - b.d);
    if (pts.length > 1) g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p.d) + ' ' + y(p.v)).join('')}" fill="none" stroke="var(--s3)" stroke-width="2"/>`;
    pts.forEach(p => g += `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>`);
  }
  // runout markers
  const mark = (sim, col, below) => {
    if (sim.out < 0 || sim.out > days) return '';
    const cx = x(sim.out), cy = y(sim.bal[sim.out]);
    const anchor = cx > W - M.r - 70 ? 'end' : cx < M.l + 70 ? 'start' : 'middle';
    return `<circle cx="${cx}" cy="${cy}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${cx}" y="${below ? cy + 20 : cy - 10}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="var(--ink-2)">Out ${fmtDate(addDays(t0, sim.out), { month: 'short', day: 'numeric' })}</text>`;
  };
  g += mark(all, 'var(--s1)', false);
  if (ess.out !== all.out) g += mark(ess, 'var(--s2)', true);
  // direct end labels (wide screens)
  if (M.r > 40) {
    let ya = y(all.bal[days]), ye = y(ess.bal[days]);
    if (Math.abs(ya - ye) < 26) { const mid = (ya + ye) / 2, s = ya <= ye ? -1 : 1; ya = mid + s * 13; ye = mid - s * 13; }
    g += `<text x="${W - M.r + 8}" y="${ya - 2}" font-size="11" fill="var(--ink-2)">All bills</text><text x="${W - M.r + 8}" y="${ya + 11}" font-size="11" font-weight="600" fill="var(--ink)" class="num">${compact(all.bal[days])}</text>`;
    g += `<text x="${W - M.r + 8}" y="${ye - 2}" font-size="11" fill="var(--ink-2)">Essentials</text><text x="${W - M.r + 8}" y="${ye + 11}" font-size="11" font-weight="600" fill="var(--ink)" class="num">${compact(ess.bal[days])}</text>`;
  }
  g += `<g id="hover" style="display:none"><line id="hx" y1="${M.t}" y2="${Hh - M.b}" stroke="var(--ink-2)" stroke-width="1"/>
        <circle id="ha" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><circle id="he" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></g>
        <rect id="hit" x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${Hh - M.t - M.b}" fill="transparent"/>`;

  const tip = document.getElementById('tip');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Projected cash balance over ${ui.range} months">${g}</svg>`;
  box.appendChild(tip);
  chartState = { x, y, dMin, days, all, ess, M, W, cks, t0 };

  const svg = box.querySelector('svg'), hit = svg.querySelector('#hit'), hov = svg.querySelector('#hover');
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    let d = Math.round(dMin + (px - M.l) / (W - M.l - M.r) * (days - dMin));
    d = Math.max(dMin, Math.min(days, d));
    const date = addDays(t0, d);
    let rows = '';
    if (d >= 0) {
      hov.style.display = '';
      svg.querySelector('#hx').setAttribute('x1', x(d)); svg.querySelector('#hx').setAttribute('x2', x(d));
      const ha = svg.querySelector('#ha'), he = svg.querySelector('#he');
      ha.setAttribute('cx', x(d)); ha.setAttribute('cy', y(all.bal[d]));
      he.setAttribute('cx', x(d)); he.setAttribute('cy', y(ess.bal[d]));
      rows = `<div class="row"><span><i style="background:var(--s1)"></i>All bills</span><b class="num">${money(all.bal[d])}</b></div>
              <div class="row"><span><i style="background:var(--s2)"></i>Essentials only</span><b class="num">${money(ess.bal[d])}</b></div>`;
    } else {
      hov.style.display = 'none';
      const near = cks.reduce((b, c) => Math.abs(c.d - d) < Math.abs(b.d - d) ? c : b, cks[0]);
      rows = near ? `<div class="row"><span><i style="background:var(--s3)"></i>Check-in ${fmtDate(addDays(t0, near.d), { month: 'short', day: 'numeric' })}</span><b class="num">${money(near.v)}</b></div>` : '';
    }
    tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${fmtDate(date)}</div>${rows}`;
    tip.style.display = 'block';
    const bx = box.getBoundingClientRect(), tx = ev.clientX - bx.left;
    tip.style.left = Math.min(Math.max(0, tx + 14), bx.width - tip.offsetWidth) + 'px';
    tip.style.top = (tx + 14 + tip.offsetWidth > bx.width ? 8 : 8) + 'px';
    if (tx + 14 + tip.offsetWidth > bx.width) tip.style.left = Math.max(0, tx - tip.offsetWidth - 14) + 'px';
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { hov.style.display = 'none'; tip.style.display = 'none'; });
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });

/* ---------- dialogs ---------- */
const dlg = document.getElementById('dlg'), form = document.getElementById('dlgForm');
let onSubmit = null;
function openDialog(title, fieldsHTML, submitLabel, handler) {
  form.innerHTML = `<h3>${title}</h3>${fieldsHTML}<div class="dlg-actions"><button type="button" data-close>Cancel</button><button class="primary" value="ok">${submitLabel}</button></div>`;
  onSubmit = handler;
  dlg.showModal();
  const first = form.querySelector('input,select'); if (first) first.focus();
}
form.addEventListener('submit', e => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(form).entries());
  form.querySelectorAll('input[type=checkbox]').forEach(c => fd[c.name] = c.checked);
  if (onSubmit && onSubmit(fd) !== false) { dlg.close(); render(); }
});
form.addEventListener('click', e => { if (e.target.closest('[data-close]')) dlg.close(); });

const fld = (label, inner, hint) => `<div class="field"><label>${label}${inner}</label>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
const freqSelect = v => `<select name="freq">${Object.entries(FREQ).map(([k, f]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${f.label}</option>`).join('')}</select>`;
const CATS = ['Housing', 'Utilities', 'Insurance', 'Health', 'Food', 'Transportation', 'Debt', 'Phone & internet', 'Subscriptions', 'Childcare', 'Personal', 'Other'];

function editBill(b) {
  const isNew = !b;
  b = b || { name: '', amount: '', freq: 'monthly', next: iso(today()), category: 'Housing', essential: true };
  const cats = [...new Set([...CATS, ...S.bills.map(x => x.category).filter(Boolean)])];
  openDialog(isNew ? 'Add bill or expense' : 'Edit bill', `
    ${fld('Name', `<input type="text" name="name" required value="${esc(b.name)}" placeholder="Rent, car insurance, groceries…">`)}
    <div class="row2">
      ${fld('Amount ($)', `<input type="number" name="amount" required min="0" step="0.01" value="${esc(b.amount)}">`)}
      ${fld('How often', freqSelect(b.freq))}
    </div>
    <div class="row2">
      ${fld('Next due date', `<input type="date" name="next" required value="${esc(b.next)}">`)}
      ${fld('Category', `<input type="text" name="category" list="catList" value="${esc(b.category)}"><datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`)}
    </div>
    ${fld('Last payment (optional)', `<input type="date" name="end" value="${esc(b.end || '')}">`, 'For loans or plans that end, like a car payment.')}
    <label class="check"><input type="checkbox" name="essential" ${b.essential ? 'checked' : ''}> Essential: I'd keep paying this even in a bare-bones budget</label>
  `, isNew ? 'Add bill' : 'Save', fd => {
    const rec = { ...b, id: b.id || uid(), name: fd.name.trim(), amount: +fd.amount, freq: fd.freq, next: fd.next, category: fd.category.trim() || 'Other', essential: !!fd.essential, end: fd.end || '' };
    if (isNew) S.bills.push(rec); else S.bills[S.bills.findIndex(x => x.id === b.id)] = rec;
  });
}
function editIncome(i) {
  const isNew = !i;
  i = i || { name: '', amount: '', freq: 'weekly', next: iso(today()), end: '' };
  openDialog(isNew ? 'Add money coming in' : 'Edit income', `
    ${fld('Source', `<input type="text" name="name" required value="${esc(i.name)}" placeholder="Unemployment benefits, severance, freelance…">`)}
    <div class="row2">
      ${fld('Amount ($, after tax)', `<input type="number" name="amount" required min="0" step="0.01" value="${esc(i.amount)}">`)}
      ${fld('How often', freqSelect(i.freq))}
    </div>
    <div class="row2">
      ${fld('Next payment date', `<input type="date" name="next" required value="${esc(i.next)}">`)}
      ${fld('Last payment (optional)', `<input type="date" name="end" value="${esc(i.end || '')}">`)}
    </div>
    <div class="hint">Unemployment benefits usually stop after a set number of weeks, so give them an end date. Use "One time" for severance or a tax refund.</div>
  `, isNew ? 'Add income' : 'Save', fd => {
    const rec = { ...i, id: i.id || uid(), name: fd.name.trim(), amount: +fd.amount, freq: fd.freq, next: fd.next, end: fd.end || '' };
    if (isNew) S.income.push(rec); else S.income[S.income.findIndex(x => x.id === i.id)] = rec;
  });
}
function editAccount(a) {
  const isNew = !a;
  a = a || { name: '', balance: '', include: true };
  openDialog(isNew ? 'Add account' : 'Edit account', `
    ${fld('Account name', `<input type="text" name="name" required value="${esc(a.name)}" placeholder="Checking, high-yield savings…">`)}
    ${fld('Current balance ($)', `<input type="number" name="balance" required step="0.01" value="${esc(a.balance)}">`)}
    <label class="check"><input type="checkbox" name="include" ${a.include !== false ? 'checked' : ''}> Count this toward my runway</label>
  `, isNew ? 'Add account' : 'Save', fd => {
    const rec = { ...a, id: a.id || uid(), name: fd.name.trim(), balance: +fd.balance, include: !!fd.include, updated: iso(today()) };
    if (isNew) S.accounts.push(rec); else S.accounts[S.accounts.findIndex(x => x.id === a.id)] = rec;
  });
}
function checkinDialog() {
  if (!S.accounts.length) { editAccount(); return; }
  openDialog('Balance check-in', `
    <p class="sub" style="margin-top:-6px">Enter what each account shows right now. This updates your balances and records a data point.</p>
    ${S.accounts.map(a => fld(esc(a.name) + (a.include === false ? ' <span class="muted">(not counted)</span>' : ''), `<input type="number" step="0.01" name="acc_${a.id}" value="${+a.balance || 0}">`)).join('')}
  `, 'Save check-in', fd => {
    const d = iso(today());
    S.accounts.forEach(a => { if (fd['acc_' + a.id] !== undefined && fd['acc_' + a.id] !== '') { a.balance = +fd['acc_' + a.id]; a.updated = d; } });
    S.checkins = S.checkins.filter(c => c.date !== d);
    S.checkins.push({ date: d, total: cashTotal() });
    S.checkins.sort((a, b) => a.date.localeCompare(b.date));
  });
}
function advance(item) {
  if (item.freq === 'once') return null;
  const n = nthOccurrence(parse(item.next), item.freq, 1);
  if (item.end && n > parse(item.end)) return null;
  return iso(n);
}
function settle(kind, id) {
  const list = kind === 'bill' ? S.bills : S.income, item = list.find(x => x.id === id);
  if (!item) return;
  const counted = S.accounts.filter(a => a.include !== false);
  const accs = counted.length ? counted : S.accounts;
  openDialog(kind === 'bill' ? `Mark "${esc(item.name)}" paid` : `Mark "${esc(item.name)}" received`, `
    <div class="row2">
      ${fld('Amount ($)', `<input type="number" name="amount" step="0.01" min="0" value="${+item.amount}">`)}
      ${fld('Date', `<input type="date" name="date" value="${iso(today())}">`)}
    </div>
    ${accs.length ? fld(kind === 'bill' ? 'Paid from' : 'Deposited to', `<select name="acc">${accs.map(a => `<option value="${a.id}">${esc(a.name)} (${money(a.balance)})</option>`).join('')}<option value="">Don't change any balance</option></select>`) : ''}
    <div class="hint">The next due date moves to ${advance(item) ? fmtDate(parse(advance(item))) : '(none: this item is finished and will be removed)'}.</div>
  `, kind === 'bill' ? 'Mark paid' : 'Mark received', fd => {
    const amt = +fd.amount || 0, acc = S.accounts.find(a => a.id === fd.acc);
    if (acc) { acc.balance = +((+acc.balance || 0) + (kind === 'bill' ? -amt : amt)).toFixed(2); acc.updated = iso(today()); }
    S.activity.push({ date: fd.date || iso(today()), name: item.name, amount: kind === 'bill' ? -amt : amt, account: acc ? acc.name : '' });
    if (S.activity.length > 500) S.activity = S.activity.slice(-500);
    const n = advance(item);
    if (n) item.next = n; else list.splice(list.indexOf(item), 1);
  });
}

/* ---------- sample data ---------- */
function sample() {
  const t = today(), d = n => iso(addDays(t, n));
  const nextDom = dom => { let x = new Date(t.getFullYear(), t.getMonth(), dom); if (x < t) x = addMonths(x, 1); return iso(x); };
  S = blank();
  S.settings.cushion = 1000;
  S.accounts = [
    { id: uid(), name: 'Checking', balance: 4850, include: true, updated: d(0) },
    { id: uid(), name: 'High-yield savings', balance: 21500, include: true, updated: d(0) },
    { id: uid(), name: '401(k)', balance: 62000, include: false, updated: d(0) }
  ];
  S.bills = [
    { id: uid(), name: 'Rent', amount: 1950, freq: 'monthly', next: nextDom(1), category: 'Housing', essential: true },
    { id: uid(), name: 'Electric & gas', amount: 165, freq: 'monthly', next: nextDom(12), category: 'Utilities', essential: true },
    { id: uid(), name: 'Internet', amount: 70, freq: 'monthly', next: nextDom(18), category: 'Phone & internet', essential: true },
    { id: uid(), name: 'Phone', amount: 85, freq: 'monthly', next: nextDom(22), category: 'Phone & internet', essential: true },
    { id: uid(), name: 'Health insurance (COBRA)', amount: 640, freq: 'monthly', next: nextDom(1), category: 'Insurance', essential: true },
    { id: uid(), name: 'Car payment', amount: 389, freq: 'monthly', next: nextDom(15), category: 'Transportation', essential: true, end: iso(addMonths(t, 14)) },
    { id: uid(), name: 'Car insurance', amount: 132, freq: 'monthly', next: nextDom(8), category: 'Insurance', essential: true },
    { id: uid(), name: 'Gas', amount: 60, freq: 'biweekly', next: d(3), category: 'Transportation', essential: true },
    { id: uid(), name: 'Groceries', amount: 140, freq: 'weekly', next: d(2), category: 'Food', essential: true },
    { id: uid(), name: 'Student loan', amount: 285, freq: 'monthly', next: nextDom(25), category: 'Debt', essential: true },
    { id: uid(), name: 'Eating out', amount: 180, freq: 'monthly', next: nextDom(28), category: 'Food', essential: false },
    { id: uid(), name: 'Streaming services', amount: 48, freq: 'monthly', next: nextDom(5), category: 'Subscriptions', essential: false },
    { id: uid(), name: 'Gym', amount: 55, freq: 'monthly', next: nextDom(3), category: 'Personal', essential: false },
    { id: uid(), name: 'Renters insurance', amount: 168, freq: 'annual', next: iso(addMonths(t, 4)), category: 'Insurance', essential: true }
  ];
  S.income = [
    { id: uid(), name: 'Unemployment benefits', amount: 520, freq: 'weekly', next: d(4), end: d(4 + 7 * 20) },
    { id: uid(), name: 'Freelance project', amount: 1200, freq: 'monthly', next: nextDom(20), end: iso(addMonths(t, 3)) },
    { id: uid(), name: 'Tax refund', amount: 1400, freq: 'once', next: iso(addMonths(t, 5)), end: '' }
  ];
  const tot = cashTotal();
  S.checkins = [
    { date: d(-42), total: tot + 4100 }, { date: d(-28), total: tot + 2600 },
    { date: d(-14), total: tot + 1350 }, { date: d(0), total: tot }
  ];
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action, kind = el.dataset.kind, id = el.dataset.id;
  const find = () => (kind === 'bill' ? S.bills : kind === 'income' ? S.income : S.accounts).find(x => x.id === id);
  switch (a) {
    case 'add': ({ bill: editBill, income: editIncome, account: editAccount })[kind](); break;
    case 'edit': ({ bill: editBill, income: editIncome, account: editAccount })[kind](find()); break;
    case 'del': {
      const it = find(); if (!it || !confirm(`Delete "${it.name}"?`)) return;
      const list = kind === 'bill' ? S.bills : kind === 'income' ? S.income : S.accounts;
      list.splice(list.indexOf(it), 1); render(); break;
    }
    case 'settle': settle(kind, id); break;
    case 'skip': {
      const it = find(); if (!it) return;
      const n = advance(it);
      if (n) it.next = n; else if (confirm(`"${it.name}" has no later date. Remove it?`)) { const l = kind === 'bill' ? S.bills : S.income; l.splice(l.indexOf(it), 1); }
      render(); break;
    }
    case 'checkin': checkinDialog(); break;
    case 'delck': S.checkins = S.checkins.filter(c => c.date !== el.dataset.date); render(); break;
    case 'tab': ui.tab = el.dataset.tab; render(); break;
    case 'range': ui.range = +el.dataset.m; render(); break;
    case 'sample':
      if ((S.accounts.length || S.bills.length || S.income.length) && !confirm('Replace your current data with sample data? Export a backup first if you want to keep it.')) return;
      sample(); render(); break;
    case 'reset':
      if (!confirm('Erase all accounts, bills, income and history from this browser?')) return;
      S = blank(); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = `runway-backup-${iso(today())}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000); break;
    }
    case 'import': document.getElementById('importFile').click(); break;
    case 'theme': {
      const r = document.documentElement;
      const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem(KEY + '.theme', r.dataset.theme); } catch (er) {}
      render(); break;
    }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.setting;
  if (!k) return;
  const v = +e.target.value;
  if (k === 'targetMonths') S.settings.targetMonths = Math.max(1, Math.min(60, v || 12));
  else if (k === 'cushion') S.settings.cushion = Math.max(0, v || 0);
  else if (k === 'horizon') { S.settings.horizon = v; if (ui.range > v) ui.range = v; }
  render();
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.bills) || !Array.isArray(d.accounts)) throw new Error('Not a Runway Tracker backup');
    if (!confirm('Replace your current data with this backup?')) return;
    S = { ...blank(), ...d, settings: { ...blank().settings, ...(d.settings || {}) } };
    render();
  } catch (err) { alert('Could not import: ' + err.message); }
});

try { const th = localStorage.getItem(KEY + '.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
render();
})();
</script>
